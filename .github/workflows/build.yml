name: Build

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Paper plugin
        run: gradle clean build

      - name: Build companion packs
        run: python3 resource-pack/tools/package_packs.py

      - name: Upload plugin and pack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UltraOP-MobChests-${{ github.sha }}
          path: |
            plugin/build/libs/*.jar
            build/distributions/*.zip
          if-no-files-found: error
