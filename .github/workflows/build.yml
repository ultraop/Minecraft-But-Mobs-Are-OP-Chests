name: Build

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Paper plugin
        run: gradle clean build

      - name: Verify plugin output
        run: |
          test -f plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar
          jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -q "in/ultraop/mobchests/listener/MobChestListener.class"

      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltraOP-MobChests-No-ResourcePack-${{ github.sha }}
          path: plugin/build/libs/*.jar
          if-no-files-found: error
