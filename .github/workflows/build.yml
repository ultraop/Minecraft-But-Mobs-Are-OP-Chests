name: Build
on:
  push:
    branches: [main, "develop/**", "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build Paper plugin
        run: gradle clean build
      - name: Validate event handler signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          failed = []
          pattern = re.compile(r'@EventHandler(?:\([^)]*\))?\s*(?:public|protected|private)\s+[\w<>?,.\[\] ]+\s+\w+\s*\(([^)]*)\)', re.S)
          for path in Path("plugin/src/main/java").rglob("*.java"):
              source = path.read_text(encoding="utf-8")
              for match in pattern.finditer(source):
                  params = [part.strip() for part in match.group(1).split(",") if part.strip()]
                  if len(params) != 1 or not params[0].split()[-2].endswith("Event"):
                      failed.append(f"{path}: @EventHandler must declare exactly one Event parameter: {match.group(1)}")
          if failed:
              raise SystemExit("\n".join(failed))
          print("All @EventHandler methods have a single Event parameter.")
          config = Path("plugin/src/main/resources/config.yml").read_text(encoding="utf-8")
          used_paths = set()
          for path in Path("plugin/src/main/java").rglob("*.java"):
              source = path.read_text(encoding="utf-8")
              used_paths.update(re.findall(r'get(?:Boolean|Int|Double|String|StringList)\\("([^"]+)"', source))
          for dotted_path in sorted(used_paths):
              segments = dotted_path.split(".")
              for segment in segments:
                  if not re.search(r"^\\s*" + re.escape(segment) + r":", config, re.M):
                      failed.append(f"config.yml is missing a key used by Java code: {dotted_path}")
                      break
          if "rarity:" not in config:
              failed.append("config.yml is missing the rarity section")
          if failed:
              raise SystemExit("\\n".join(failed))
          print("All literal Java config paths are represented in config.yml.")
          PY
      - name: Verify plugin output
        run: |
          test -f plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar
          jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -q "in/ultraop/mobchests/listener/MobChestListener.class"
          jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -q "in/ultraop/mobchests/loot/MobLootGenerator.class"
          jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -q "in/ultraop/mobchests/loot/CustomMobItems.class"
          jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -q "in/ultraop/mobchests/command/MobChestsCommand.class"
          jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -q "plugin.yml"
          ! jar tf plugin/build/libs/UltraOP-MobChests-0.1.0-SNAPSHOT.jar | grep -Eq "CustomItem\.class|GoldenFood|LiquidGold"
      - uses: actions/upload-artifact@v4
        with:
          name: MobChests-Paper-26.3-${{ github.sha }}
          path: plugin/build/libs/*.jar
          if-no-files-found: error
