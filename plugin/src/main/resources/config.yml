# Mob Chests — Minecraft Java 26.3 | Paper | Java 25
# No client gameplay mod is required. The Liquid Gold companion pack is needed for gold visuals.

settings:
  language: en
  debug: false

prototype:
  enabled: true
  support-all-mobs: true
  supported-entities: []
  excluded-entities: []
  opening-head-look-degrees: 88.0
  open-animation-ticks: 12
  close-animation-ticks: 10

freeze:
  subtle-tremble-enabled: true
  tremble-interval-ticks: 8
  tremble-head-degrees: 0.8

interaction:
  first-right-click-freezes: true
  second-right-click-opens: true
  one-inventory-session-per-entity: true
  close-without-taking-consumes-chest: true
  restore-original-mob-state-on-close: true
  save-remaining-chest-loot-on-mob: true
  replace-vanilla-drops-after-chest-used: true

loot:
  minimum-item-stacks: 14
  maximum-item-stacks: 18
  custom-equipment-chance: 0.10
  liquid-gold-chance: 0.08
  golden-food-chance: 0.06
  burst-max-stacks: 18
  burst-ratio: 0.50
  prevent-full-armor-set-per-chest: true
  dimension-progression-loot: true

rarity:
  common: 70.0
  uncommon: 20.0
  rare: 7.0
  epic: 2.0
  legendary: 0.8
  mythic: 0.2

# All chest visuals use the real vanilla Mob and a fixed entity pitch with AI disabled.
# No resource pack or client renderer is used. Independent squid tentacle/body-bone
# animation requires a custom renderer.

liquid-gold:
  enabled: true
  flow-interval-ticks: 4
  horizontal-range: 7
  vertical-range: 8
  max-active-cells: 2048
  diagonal-infinite-source: true
  effects-duration-ticks: 200
