# UltraOP Mob Chests — Minecraft Java 26.3 | Paper | Java 25
# No client mod or resource pack is required for mob chest interactions.

settings:
  language: en
  debug: false

prototype:
  enabled: true
  support-all-mobs: true
  supported-entities: []
  excluded-entities: []
  opening-head-pitch-degrees: -90.0
  open-animation-ticks: 12
  close-animation-ticks: 10

freeze:
  subtle-tremble-enabled: true
  tremble-interval-ticks: 8
  tremble-pitch-degrees: 0.8

interaction:
  first-right-click-freezes: true
  second-right-click-opens: true
  one-inventory-session-per-entity: true
  close-without-taking-consumes-chest: true
  restore-original-mob-state-on-close: true
  save-remaining-chest-loot-on-mob: true
  replace-vanilla-drops-after-chest-used: true

loot:
  minimum-item-stacks: 5
  maximum-item-stacks: 9
  custom-equipment-chance: 0.10
  liquid-gold-chance: 0.07
  golden-food-chance: 0.06
  burst-max-stacks: 2
  prevent-full-armor-set-per-chest: true
  dimension-progression-loot: true

rarity:
  common: 70.0
  uncommon: 20.0
  rare: 7.0
  epic: 2.0
  legendary: 0.8
  mythic: 0.2

# All chest visuals use the real vanilla mob model and entity pitch.
# Custom item textures and custom independent body-part renderers require
# a resource pack or client renderer; this build does not use either.
