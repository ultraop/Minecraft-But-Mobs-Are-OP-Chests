# UltraOP Mob Chests — Paper 26.3 | Java 25
# This build exposes the adult-Cow animation prototype only.

settings:
  language: en
  debug: false

prototype:
  enabled: true
  entity-type: COW
  adults-only: true
  open-animation-ticks: 10
  close-animation-ticks: 8

interaction:
  first-right-click-freezes: true
  second-right-click-opens: true
  one-inventory-session-per-entity: true
  close-without-taking-consumes-chest: true
  restore-original-mob-state-on-close: true
  preserve-vanilla-drops-and-xp-after-looting: true

loot-prototype:
  minimum-item-stacks: 4
  maximum-item-stacks: 8
  variable-stack-amounts: true

resource-pack:
  required-for-cow-model: true
  minecraft-version: "26.3"
  resource-pack-format: "97.1"

# The following systems are future modules; their values are design defaults only.
loot:
  custom-equipment-chance: 0.10
  prevent-full-armor-set-per-chest: true
  persist-result-per-entity: true

rarity:
  common: 70.0
  uncommon: 20.0
  rare: 7.0
  epic: 2.0
  legendary: 0.8
  mythic: 0.2
